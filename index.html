<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Noah Bristol</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="https://www.svgrepo.com/show/5121/star.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <script src="https://myliferebooted.mykajabi.com/forms/2149024625/embed.js"></script>
      <div id="form-fallback" hidden>
        <p class="fallback-title">The form didn't load</p>
        <p>Ad blockers and script blockers often block this page's signup form. If you run one, please allow this page and refresh. The form will appear here.</p>
      </div>
      <noscript>
        <p>This page needs JavaScript turned on to show the signup form. Please enable JavaScript and refresh.</p>
      </noscript>
    </div>
    <footer>
        <p>
            <a href="https://www.youtube.com/@noah-the-optimist" target="_blank">
              <img src="assets/images/youtube-icon.png" alt="YouTube" style="width: 24px; vertical-align: text-bottom; margin-right: 4px;">
              Noah Bristol
            </a>
          </p>
          <p><a href="privacy.html">Privacy Policy</a></p>
        </footer>
  </div>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!document.getElementById('kajabi-form')) {
          var fb = document.getElementById('form-fallback');
          if (fb) { fb.hidden = false; }
        }
      }, 3000);
    });
  </script>
</body>
</html>
